<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FarmBuddy</title>
  <link rel="stylesheet" href="styles/buyer.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <h1>Farm<span>buddy</span></h1>
    </div>
    <nav>
      <a class="cart-link" onclick="toggleCartPopup()">Cart
        <span id="cartCount">0</span>
      </a>
      <div class="profile-menu">
        <img src="https://in.images.search.yahoo.com/images/view;_ylt=AwrPrxHhzxFoNocVFKa9HAx.;_ylu=c2VjA3NyBHNsawNpbWcEb2lkA2I3MzIxYjUzZDAyYmQ4NDg5NzBhYmI0MTJiZmU3MzY3BGdwb3MDMwRpdANiaW5n?back=https%3A%2F%2Fin.images.search.yahoo.com%2Fsearch%2Fimages%3Fp%3Dtomatoes%2Bimages%26type%3DE210IN826G0%26fr%3Dmcafee%26fr2%3Dpiv-web%26tab%3Dorganic%26ri%3D3&w=4272&h=2848&imgurl=gardenandhappy.com%2Fwp-content%2Fuploads%2F2018%2F10%2Ffood-fresh-tomatoes-162830.jpg&rurl=https%3A%2F%2Fgardenandhappy.com%2Ftomato-varieties%2F&size=1471KB&p=tomatoes+images&oid=b7321b53d02bd848970abb412bfe7367&fr2=piv-web&fr=mcafee&tt=Totally+Tomatoes%21+28+Spectacular+Tomato+Varieties+to+Explore+-+Garden+...&b=0&ni=21&no=3&ts=&tab=organic&sigr=N9CNV.exkjTF&sigb=_jZl2remPkvC&sigi=7ufyc2QeRDur&sigt=aPkVeVN_ZtAk&.crumb=t9S6kkl3cUr&fr=mcafee&fr2=piv-web&type=E210IN826G0" alt="Profile" class="profile-pic" onclick="toggleProfilePanel()">
        <div class="dropdown" id="profileDropdown">
          <a href="#" onclick="toggleProfilePanel()">Edit Profile</a>
          <a href="#">Logout</a>
        </div>
      </div>
    </nav>
  </header>

  <!-- Filters -->
  <section class="filters">
    <input placeholder="Search products..." />
    <select>
      <option value="">All Categories</option>
      <option value="vegetables">Vegetables</option>
      <option value="fruits">Fruits</option>
      <option value="grains">Grains</option>
    </select>
  </section>

  <!-- Product Section -->
  <main>
    <div class="products-container">
      <div class="product-card">
        <img src="assets/tomatoes.jpg" alt="Tomato" />
        <h3>Tomato</h3>
        <p>₹30</p>
        <button onclick="addToCart()">Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="assets/mango.jpg" alt="Mango" />
        <h3>Mango</h3>
        <p>₹50</p>
        <button onclick="addToCart()">Add to Cart</button>
      </div>
    </div>
  </main>

 <!-- Profile Panel -->
<div class="profile-panel" id="profilePanel">
  <div class="profile-panel-content">
    <div class="profile-header">
      <img src="path-to-default-image.jpg" alt="Profile Preview" class="profile-preview" id="profilePreview">
      <h2>User Profile</h2>
    </div>
    <form>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>
      
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>
      
      <label for="profileImage">Change Profile Image:</label>
      <input type="file" id="profileImage" name="profileImage" accept="image/*">
      
      <button type="submit">Save Changes</button>
    </form>
  </div>
</div>

<!-- Optional: Button to Open Profile Panel -->
<button id="openProfileBtn">Open Profile</button>

<script>
  // Toggle Profile Panel visibility
  document.getElementById('openProfileBtn').addEventListener('click', function() {
    document.getElementById('profilePanel').classList.toggle('open');
  });

  // Optional: Handle profile image preview on file select
  document.getElementById('profileImage').addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('profilePreview').src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  });
</script>


  <!-- Cart Popup -->
  <div class="cart-popup" id="cartPopup">
    <div class="cart-popup-content">
      <h3>Cart</h3>
      <ul id="cartList">
        <!-- Dynamic items go here -->
      </ul>
      <div class="total">
        <p>Total: ₹<span id="totalAmount">0</span></p>
        <button onclick="checkout()">Checkout</button>
        <button class="close-cart-btn" onclick="toggleCartPopup()">×</button>
      </div>
    </div>
  </div>

  <script>
    let cartCount = 0;
    let totalAmount = 0;

    function addToCart() {
      cartCount++;
      totalAmount += 30; // dummy price
      document.getElementById('cartCount').textContent = cartCount;
      document.getElementById('totalAmount').textContent = totalAmount;

      const item = document.createElement('li');
      item.textContent = "Item x1 - ₹30";
      document.getElementById('cartList').appendChild(item);
    }

    function toggleCartPopup() {
      document.getElementById('cartPopup').classList.toggle('open');
    }

    function toggleProfilePanel() {
      document.getElementById('profilePanel').classList.toggle('open');
      document.getElementById('profileDropdown').classList.toggle('show');
    }

    function checkout() {
      alert('Proceeding to checkout!');
    }
  </script>

</body>
</html>
