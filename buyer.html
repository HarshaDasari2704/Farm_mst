<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FarmBuddy</title>
  <link rel="stylesheet" href="styles/buyer.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <h1>Farm<span>buddy</span></h1>
    </div>
    <nav>
      <a class="cart-link" id="cartLink" href="javascript:void(0)" onclick="toggleCartPopup()">Cart
        <span id="cartCount">0</span>
      </a>
      <div class="profile-menu">
        <img src="assets/images/default-profile.jpg" alt="Profile" class="profile-pic" id="profilePic">
        <div class="dropdown" id="profileDropdown">
          <a href="#" id="editProfile">Edit Profile</a>
          <a href="#">Logout</a>
        </div>
      </div>
    </nav>
  </header>

  <!-- Filters -->
  <section class="filters">
    <input placeholder="Search products..." />
    <select>
      <option value="">All Categories</option>
      <option value="vegetables">Vegetables</option>
      <option value="fruits">Fruits</option>
      <option value="grains">Grains</option>
    </select>
  </section>

  <!-- Product Section -->
  <main>
    <div class="products-container">
      <div class="product-card">
        <img src="assets/tomatoes.jpg" alt="Tomato" />
        <h3>Tomato</h3>
        <p>₹30</p>
        <button onclick="addToCart()">Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="assets/mango.jpg" alt="Mango" />
        <h3>Mango</h3>
        <p>₹50</p>
        <button onclick="addToCart()">Add to Cart</button>
      </div>
    </div>
  </main>

  <!-- Profile Panel -->
  <div class="profile-panel" id="profilePanel">
    <div class="profile-panel-content">
      <div class="profile-header">
        <img src="assets/images/default-profile.jpg" alt="Profile Preview" class="profile-preview" id="profilePreview">
        <h2>User Profile</h2>
      </div>
      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        
        <label for="profileImage">Change Profile Image:</label>
        <input type="file" id="profileImage" name="profileImage" accept="image/*">
        
        <button type="submit">Save Changes</button>
      </form>
    </div>
  </div>

  <!-- Optional: Button to Open Profile Panel -->
  <button id="openProfileBtn">Open Profile</button>

  <!-- Cart Popup -->
  <div class="cart-popup" id="cartPopup">
    <div class="cart-popup-content">
      <h3>Cart</h3>
      <ul id="cartList"></ul>
      <div class="total">
        <p>Total: ₹<span id="totalAmount">0</span></p>
        <button onclick="checkout()">Checkout</button>
        <button class="close-cart-btn" onclick="toggleCartPopup()">×</button>
      </div>
    </div>
  </div>

  <!-- JS File -->
  <script src="buyer.js"></script>
</body>
</html>
